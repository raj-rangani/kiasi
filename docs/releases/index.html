<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiasi · Releases</title>
<meta name="description" content="Every Kiasi release: what is new, what was fixed, what to check when you upgrade, and what is still known to be rough.">
<meta property="og:title" content="Kiasi · Releases">
<meta property="og:description" content="Every Kiasi release: what is new, what was fixed, what to check when you upgrade, and what is still known to be rough.">
<meta property="og:type" content="website">
<link rel="icon" href="../mark.svg" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="Kiasi releases" href="../releases.xml">
<link rel="stylesheet" href="../site.css">
<style>
.rl { padding: 72px 0 24px; }
.rl h1 { margin: 0; max-width: none; font-size: clamp(36px, 6vw, 64px); }
.latest { margin-top: 30px; background: var(--card); border: 1px solid var(--rule2); border-radius: var(--r); padding: clamp(20px, 4vw, 40px); min-width: 0; }
.latest .h2 { overflow-wrap: anywhere; }
.latest .sub { overflow-wrap: anywhere; }
.latest .sub a, .rbody a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule2); }
.hl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-top: 28px; }
.hl article { background: var(--bg2); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; font-size: 14.5px; color: var(--ink2); min-width: 0; overflow-wrap: anywhere; }
.hl h3 { margin: 0 0 6px; font: 400 19px/1.25 var(--display); color: var(--ink); letter-spacing: -0.01em; }
.hl p { margin: 0; }
.upd { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; }
.upd .cmd { margin: 0; }
.upd a.ext { font-family: var(--mono); font-size: 13px; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; }
.all { padding: 56px 0 24px; }
.all .h2 { font-size: clamp(28px, 4vw, 40px); }
.list { margin-top: 26px; border-top: 1px solid var(--rule); }
.rel { border-bottom: 1px solid var(--rule); scroll-margin-top: 84px; }
.rel summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 120px minmax(0, 1fr) 20px; gap: 6px 22px; align-items: baseline; padding: 20px 4px; }
.rel summary::-webkit-details-marker { display: none; }
.rel summary:hover .rt { color: var(--accent); }
.rel summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.rd { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.rt { font-family: var(--display); font-size: clamp(20px, 2.6vw, 26px); line-height: 1.2; letter-spacing: -0.01em; transition: color .2s; overflow-wrap: anywhere; }
.rt .pill { font-size: 11px; padding: 2px 10px 2px 8px; margin-left: 10px; vertical-align: 3px; }
.rs { display: block; margin-top: 4px; font-size: 14.5px; color: var(--ink2); overflow-wrap: anywhere; }
.chev { width: 14px; height: 14px; align-self: center; justify-self: end; color: var(--muted); transition: transform .25s var(--ease); }
.rel[open] .chev { transform: rotate(90deg); }
.rbody { padding: 0 4px 28px 146px; font-size: 15px; color: var(--ink2); min-width: 0; overflow-wrap: anywhere; }
.rbody > p { margin: 0 0 18px; }
.rbody h4 { margin: 22px 0 8px; font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.rbody ul { margin: 0; padding-left: 20px; }
.rbody li { margin: 0 0 8px; }
.rbody li b { color: var(--ink); font-weight: 600; }
.rlinks { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--mono); font-size: 13px; }
.rlinks a { text-decoration: underline; text-underline-offset: 3px; }
.note { color: var(--muted); font-family: var(--mono); font-size: 13px; margin-top: 26px; }
@media (max-width: 640px) {
  .rl { padding-top: 44px; }
  .rel summary { grid-template-columns: minmax(0, 1fr) 20px; }
  .rd { grid-column: 1; }
  .rbody { padding-left: 4px; }
  .chev { grid-column: 2; grid-row: 1 / span 2; }
}
@media (prefers-reduced-motion: no-preference) {
  .rl > * { animation: rise .7s var(--ease) both; }
  .rl > :nth-child(2) { animation-delay: .08s; }
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="../"><img src="../mark.svg" alt="">Kiasi</a>
    <nav class="nav" aria-label="Sections">
      <a href="../#how">How it works</a>
      <a href="../#features">What it does</a>
      <a href="../benchmark/">Benchmark</a>
      <a class="on" href="./" aria-current="page">Releases</a>
      <a href="../#faq">FAQ</a>
      <a href="../#install">Install</a>
    </nav>
    <div class="topright">
      <a class="ghbtn" href="https://github.com/raj-rangani/kiasi" aria-label="Kiasi on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a>
      <button class="iconbtn" id="theme" type="button" aria-label="Toggle light mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="rl">
    <p class="eyebrow" id="latest-eyebrow">Latest release</p>
    <div id="latest" class="latest" aria-live="polite">
      <h1 class="h2">Loading the latest release</h1>
    </div>
    <noscript><p class="note">The release list needs JavaScript. The same notes are on <a href="https://github.com/raj-rangani/kiasi/releases">GitHub</a>.</p></noscript>
  </section>

  <section class="all">
    <h2 class="h2">All releases</h2>
    <div class="list" id="list"></div>
    <p class="note" id="status"></p>
  </section>

  <footer class="foot">
    <span>Kiasi · a Claude Code plugin · MIT</span>
    <span><a href="https://github.com/raj-rangani/kiasi">GitHub</a> · <a href="../releases.xml">Atom feed</a> · <a href="https://github.com/raj-rangani/kiasi/blob/main/CHANGELOG.md">Changelog</a></span>
  </footer>
</main>
<script>
(function () {
  var root = document.documentElement;
  var CMD = '/plugin marketplace update kiasi\n/plugin update kiasi';
  var CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';
  var esc = function (v) { return String(v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  try { if (localStorage.getItem('kiasi-theme') === 'light') root.dataset.theme = 'light'; } catch (e) {}
  document.getElementById('theme').addEventListener('click', function () {
    var light = root.dataset.theme === 'light';
    if (light) delete root.dataset.theme; else root.dataset.theme = 'light';
    try { localStorage.setItem('kiasi-theme', light ? 'dark' : 'light'); } catch (e) {}
  });

  var top = document.querySelector('.top');
  var onScroll = function () { top.classList.toggle('scrolled', scrollY > 8); };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  var bindCopy = function (scope) {
    scope.querySelectorAll('.copy').forEach(function (b) {
      b.addEventListener('click', function () {
        var text = b.dataset.copy;
        var done = function () { var was = b.textContent; b.textContent = 'Copied'; b.classList.add('ok'); setTimeout(function () { b.textContent = was; b.classList.remove('ok'); }, 1400); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
      });
    });
  };

  var plainText = function (h) { var d = document.createElement('div'); d.innerHTML = h; return d.textContent.trim(); };
  var section = function (rel, name) {
    return rel.sections.filter(function (s) { return s.heading.toLowerCase() === name; })[0];
  };
  var blurb = function (rel) {
    var hl = section(rel, 'highlights');
    var first = hl && hl.items[0];
    if (first && first.lead) return first.lead;
    return plainText(rel.summary);
  };

  var latestBlock = function (rel) {
    var hl = section(rel, 'highlights');
    var cards = hl ? hl.items.map(function (it) {
      var body = it.lead ? it.html.replace(/^<b>[\s\S]*?<\/b>\s*/, '') : it.html;
      return '<article>' + (it.lead ? '<h3>' + esc(it.lead) + '</h3>' : '') + '<p>' + body + '</p></article>';
    }).join('') : '';
    return '<h1 class="h2">' + esc(rel.title) + '</h1>'
      + (rel.summary ? '<p class="sub">' + rel.summary + '</p>' : '')
      + (cards ? '<div class="hl">' + cards + '</div>' : '')
      + '<div class="upd"><div class="cmd"><span>/plugin marketplace update kiasi</span><button class="copy" type="button" data-copy="' + esc(CMD) + '">Copy both lines</button></div>'
      + '<a class="ext" href="' + esc(rel.url) + '">Release on GitHub</a></div>';
  };

  var row = function (rel) {
    var b = blurb(rel);
    var secs = rel.sections.map(function (s) {
      return '<h4>' + esc(s.heading) + '</h4><ul>' + s.items.map(function (i) { return '<li>' + i.html + '</li>'; }).join('') + '</ul>';
    }).join('');
    return '<details class="rel" id="' + esc(rel.tag) + '"><summary>'
      + '<span class="rd">' + esc(rel.date) + '</span>'
      + '<span><span class="rt">' + esc(rel.title) + (rel.latest ? '<span class="pill"><i></i>Latest</span>' : '') + '</span>' + (b ? '<span class="rs">' + esc(b) + '</span>' : '') + '</span>'
      + CHEV + '</summary><div class="rbody">'
      + (rel.summary ? '<p>' + rel.summary + '</p>' : '') + secs
      + '<div class="rlinks"><a href="' + esc(rel.url) + '">Release on GitHub</a>' + (rel.compare ? '<a href="' + esc(rel.compare) + '">Full changelog</a>' : '') + '</div>'
      + '</div></details>';
  };

  var openHash = function (scroll) {
    var id = decodeURIComponent(location.hash.slice(1));
    if (!id) return;
    var el = document.getElementById(id);
    if (el && el.classList.contains('rel')) {
      el.open = true;
      if (scroll) el.scrollIntoView();
    }
  };

  var render = function (data) {
    var rels = data.releases || [];
    var newest = rels.filter(function (r) { return r.latest; })[0] || rels[0];
    var latest = document.getElementById('latest');
    if (!newest) { latest.innerHTML = '<h1 class="h2">No releases yet</h1>'; return; }
    document.getElementById('latest-eyebrow').textContent = 'Latest release · ' + newest.date;
    latest.innerHTML = latestBlock(newest);
    bindCopy(latest);
    var list = document.getElementById('list');
    list.innerHTML = rels.map(row).join('');
    list.querySelectorAll('details').forEach(function (d) {
      d.addEventListener('toggle', function () {
        if (d.open && location.hash !== '#' + d.id) history.replaceState(null, '', '#' + d.id);
      });
    });
    openHash(true);
    addEventListener('hashchange', function () { openHash(true); });
  };

  fetch('../releases.json').then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(render).catch(function () {
    document.getElementById('latest').innerHTML = '<h1 class="h2">Could not load the releases</h1><p class="sub">They are all on <a href="https://github.com/raj-rangani/kiasi/releases">GitHub</a>.</p>';
  });
})();
</script>
</body>
</html>
